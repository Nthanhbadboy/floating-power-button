name: Build RELEASE (publish)

# Build bản release KÝ THẬT để nộp AppGallery / phát hành.
# Chạy bằng nút "Run workflow", khi push tag v*, hoặc khi workflow này thay đổi.
# Keystore lấy từ GitHub Secrets (không bao giờ commit keystore/mật khẩu):
#   ANDROID_KEYSTORE_BASE64    (base64 của file .jks)
#   ANDROID_KEYSTORE_PASSWORD
#   ANDROID_KEY_ALIAS
#   ANDROID_KEY_PASSWORD
on:
  workflow_dispatch:
  push:
    tags:
      - "v*"
    branches:
      - "arena/aa4d9a51-floating-power-button"
      - main
    paths:
      - ".github/workflows/build-release.yml"

permissions:
  contents: read

jobs:
  build-release:
    name: Signed AAB + APK for publishing
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.24.5"
          channel: stable
          cache: true

      - name: Validate signing secrets
        run: |
          missing=""
          [ -z "$ANDROID_KEYSTORE_BASE64" ] && missing="$missing ANDROID_KEYSTORE_BASE64"
          [ -z "$ANDROID_KEYSTORE_PASSWORD" ] && missing="$missing ANDROID_KEYSTORE_PASSWORD"
          [ -z "$ANDROID_KEY_ALIAS" ] && missing="$missing ANDROID_KEY_ALIAS"
          [ -z "$ANDROID_KEY_PASSWORD" ] && missing="$missing ANDROID_KEY_PASSWORD"
          if [ -n "$missing" ]; then
            echo "::error::Missing GitHub Secrets:$missing — Repo Settings → Secrets and variables → Actions → New repository secret."
            exit 1
          fi
          echo "All 4 signing secrets are present (values hidden). Alias: $ANDROID_KEY_ALIAS"

      - name: Decode keystore & write key.properties (runner-temp only)
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
          ls -lh "$RUNNER_TEMP/release.jks"
          KEY_PROPERTIES="$GITHUB_WORKSPACE/android/key.properties" \
          STORE_FILE="$RUNNER_TEMP/release.jks" \
          python3 - <<'PY'
          import os
          def esc(v): return v.replace("\\", "\\\\")
          content = (
              f"storeFile={esc(os.environ['STORE_FILE'])}\n"
              f"storePassword={esc(os.environ['ANDROID_KEYSTORE_PASSWORD'])}\n"
              f"keyAlias={esc(os.environ['ANDROID_KEY_ALIAS'])}\n"
              f"keyPassword={esc(os.environ['ANDROID_KEY_PASSWORD'])}\n"
          )
          open(os.environ["KEY_PROPERTIES"], "w").write(content)
          print("key.properties written (passwords hidden)")
          PY

      - name: Fetch Gradle wrapper files if missing
        run: |
          if [ ! -f android/gradle/wrapper/gradle-wrapper.jar ]; then
            BASE="https://raw.githubusercontent.com/gradle/gradle/v8.4.0"
            curl -fL "$BASE/gradle/wrapper/gradle-wrapper.jar" -o android/gradle/wrapper/gradle-wrapper.jar
            curl -fL "$BASE/gradlew" -o android/gradlew
            curl -fL "$BASE/gradlew.bat" -o android/gradlew.bat
            chmod +x android/gradlew
          fi

      - name: Flutter pub get
        run: flutter pub get

      - name: Widget tests
        run: flutter test

      - name: Build RELEASE App Bundle (.aab để nộp AppGallery)
        run: |
          set +e
          flutter build appbundle --release 2>&1 | tee build-aab.log
          CODE=${PIPESTATUS[0]}
          if [ "$CODE" != "0" ]; then
            grep -E "FAILURE:|BUILD FAILED|Execution failed|What went wrong|error:|e: |Could not|FAILED" build-aab.log | grep -v "Resource missing" | head -n 60 > build-errors.txt || true
            ESC=$(perl -pe 's/%/%25/g; s/\r/%0D/g; s/\n/%0A/g' build-errors.txt)
            echo "::error title=BuildAabLog::$ESC"
          fi
          exit $CODE

      - name: Build RELEASE APK (ký thật, để cài kiểm tra / kênh ngoài)
        run: flutter build apk --release

      - name: Verify signing certificate (must NOT be Android Debug)
        run: |
          mkdir -p dist
          cp build/app/outputs/bundle/release/app-release.aab       dist/PowerVolume-v2.0.1-RELEASE.aab
          cp build/app/outputs/flutter-apk/app-release.apk          dist/PowerVolume-v2.0.1-RELEASE.apk
          APKSIGNER=$(ls "$ANDROID_SDK_ROOT"/build-tools/*/apksigner | sort -V | tail -1)
          echo "Using $APKSIGNER"
          "$APKSIGNER" verify --print-certs dist/PowerVolume-v2.0.1-RELEASE.apk | tee cert.txt
          if grep -qi "CN=Android Debug" cert.txt; then
            echo "::error::APK is debug-signed — release signing was not applied. Do NOT publish this build."
            exit 1
          fi
          grep -i "SHA-256" cert.txt || true
          (cd dist && sha256sum PowerVolume-v2.0.1-RELEASE.aab PowerVolume-v2.0.1-RELEASE.apk | tee SHA256SUMS.txt)
          ls -lh dist/

      - name: Job summary
        if: always()
        run: |
          {
            echo "## Release build (publish)"
            echo "- Artifacts: PowerVolume-v2.0.1-RELEASE.aab / .apk (xem mục Artifacts bên dưới)"
            echo '```text'
            cat cert.txt 2>/dev/null || echo "no certificate info"
            cat dist/SHA256SUMS.txt 2>/dev/null || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload RELEASE artifact
        uses: actions/upload-artifact@v4
        with:
          name: PowerVolume-v2.0.1-RELEASE-signed
          path: |
            dist/PowerVolume-v2.0.1-RELEASE.aab
            dist/PowerVolume-v2.0.1-RELEASE.apk
            dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30

      - name: Clean signing material
        if: always()
        run: |
          rm -f "$RUNNER_TEMP/release.jks" android/key.properties
          echo "Temporary keystore & key.properties removed."
